[workspace]
channels = ["conda-forge"]
name = "private-docker-image"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
start-jupyter = "jupyterhub-singleuser 2>/var/log/jupyterhub-singleuser.err >/var/log/jupyterhub-singleuser.log"

[dependencies]
python = "3.14.*"
jupyterlab = ">=4.6.2,<5"
jupyterhub = ">=5.5.0,<6"
jupyter-resource-usage = ">=1.2.1,<2"
jupyterlab_code_formatter = ">=3.0.3,<4"
jupyter-sshd-proxy = "*"
marimo = ">=0.23.16,<0.24"
gh = "*"
gh-scoped-creds = ">=4.1,<5"

[pypi-dependencies]
marimo-jupyter-extension = ">=0.3.0, <0.4"

[tool.pixitainer]
add-file = ["setup-script.sh:/opt/conf/setup-script.sh"]
post-command = ["bash /opt/conf/setup-script.sh"]

[tool.pixitainer.docker]
output = "ghcr.io/keewis/jupyterhub-marimo:latest"
user = "jovyan"
workdir = "/home/jovyan"
